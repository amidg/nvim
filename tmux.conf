# Seamless navigation between nvim splits and tmux panes (smart-splits.nvim).
# Keys are sent into nvim when the pane runs nvim, otherwise tmux handles them.

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -n M-h if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 5'
bind-key -n M-j if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 5'
bind-key -n M-k if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 5'
bind-key -n M-l if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 5'

# --- Mouse: select panes, drag borders, wheel scroll, drag-to-copy ---
set -g mouse on

# Put tmux's copies on the system clipboard (OSC52), in addition to its buffer
set -g set-clipboard on

# Make mouse-drag / double-click / triple-click copy straight to Wayland clipboard.
# wl-copy ships with Bluefin's wl-clipboard, which is present on the host.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T root DoubleClick1Pane select-pane \; copy-mode -H \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T root TripleClick1Pane select-pane \; copy-mode -H \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "wl-copy"

# Deep scrollback + nvim focus events (autoread after agent edits)
set -g history-limit 50000
set -g focus-events on

# --- Prefix-based pane navigation/resize (no Ctrl/Alt needed) ---
# C-b then h/j/k/l to move between panes, H/J/K/L to resize
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5
